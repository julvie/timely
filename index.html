<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Time & Balance Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --primary-green: #10b981;
      --light-green: #e6fffa;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #d1fae5;
      --work-blue: #38bdf8;
      --rest-green: #4ade80;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    .content-area {
      flex: 1;
      padding: 24px 20px 80px 20px;
      overflow-y: auto;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }
