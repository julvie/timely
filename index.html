<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Time & Balance Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --primary-green: #10b981;
      --light-green: #e6fffa;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #d1fae5;
      --work-blue: #38bdf8;
      --rest-green: #4ade80;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    .content-area {
      flex: 1;
      padding: 24px 20px 80px 20px;
      overflow-y: auto;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Navigation Bar */
    .nav-bar {
      display: flex;
      border-top: 1px solid #e2e8f0;
      background-color: #ffffff;
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 440px;
      z-index: 10;
    }

    .nav-btn {
      flex: 1;
      padding: 12px 0;
      border: none;
      background: none;
      font-weight: 700;
      font-size: 14px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: color 0.2s;
    }

    .nav-btn.active {
      color: #047857;
      border-top: 3px solid #10b981;
    }

    /* --- TAB 1: TODO --- */
    .todo-header {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .task-card.dragging {
      opacity: 0.4;
      border-style: dashed;
      background-color: #f0fdf4;
    }

    .left-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .drag-handle {
      color: #cbd5e1;
      font-weight: bold;
      cursor: grab;
      user-select: none;
      padding: 4px;
    }

    .checkbox {
      width: 22px;
      height: 22px;
      min-width: 22px;
      border: 2px solid #cbd5e1;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      font-size: 12px;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .checkbox.checked {
      background-color: var(--primary-green);
      border-color: var(--primary-green);
      color: white;
    }

    .task-title {
      font-weight: 600;
      color: var(--text-main);
      font-size: 15px;
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
    }

    .task-card.completed .task-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .right-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .timer-btn {
      background-color: var(--light-green);
      border: none;
      border-radius: 20px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #047857;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }

    .timer-btn.running {
      background-color: #fef3c7;
      color: #b45309;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #cbd5e1;
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
    }

    .delete-btn:hover { color: #ef4444; }

    .add-btn {
      margin-top: 16px;
      width: 100%;
      padding: 12px;
      background: var(--card-bg);
      border: 1.5px solid #a7f3d0;
      border-radius: 16px;
      color: #047857;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    /* --- TAB 2: REST --- */
    .rest-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-top: 10px;
    }

    .rest-card {
      border-radius: 24px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 190px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .card-yellow { background-color: #fef08a; }
    .card-mint   { background-color: #86efac; }
    .card-cyan   { background-color: #67e8f9; }
    .card-lime   { background-color: #a3e635; }

    .rest-card-top {
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    .rest-icon-bg {
      width: 38px;
      height: 38px;
      background-color: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .rest-info h3 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 4px;
      color: #0f172a;
    }

    .rest-info p {
      font-size: 12px;
      color: #334155;
      line-height: 1.3;
      margin-bottom: 16px;
    }

    .rest-start-btn {
      background: rgba(255, 255, 255, 0.5);
      border: none;
      border-radius: 16px;
      padding: 10px 14px;
      font-weight: 800;
      font-size: 13px;
      color: #0f172a;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
    }

    .rest-start-btn.running {
      background: #0f172a;
      color: #ffffff;
    }

    /* --- TAB 3: TREND --- */
    .trend-section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .trend-section-title h2 {
      font-size: 20px;
      font-weight: 800;
    }

    .status-badge {
      background-color: #e6fffa;
      color: #047857;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 12px;
    }

    .metrics-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .metric-item {
      display: flex;
      flex-direction: column;
    }

    .metric-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .dot-work { background-color: var(--work-blue); }
    .dot-rest { background-color: var(--rest-green); }

    .metric-value {
      font-size: 20px;
      font-weight: 800;
    }

    .progress-bar-container {
      width: 100%;
      height: 12px;
      background-color: #f1f5f9;
      border-radius: 10px;
      display: flex;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-work {
      height: 100%;
      background-color: var(--work-blue);
      width: 50%;
      transition: width 0.3s ease;
    }

    .progress-rest {
      height: 100%;
      background-color: var(--rest-green);
      width: 50%;
      transition: width 0.3s ease;
    }

    .percent-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 28px;
    }

      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding:
