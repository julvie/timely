<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Time & Balance Tracker</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --primary-green: #10b981;
      --light-green: #e6fffa;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #d1fae5;
      --work-blue: #38bdf8;
      --rest-green: #4ade80;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #f0fdf4 0%, #ecfeff 100%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .cover-screen {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at top, rgba(16, 185, 129, 0.12), transparent 40%), linear-gradient(180deg, #f8fafc 0%, #ecfdf5 100%);
    }

    .cover-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(16, 185, 129, 0.15);
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
      padding: 32px 24px;
      text-align: center;
    }

    .cover-brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #047857;
      background: #d1fae5;
      padding: 8px 12px;
      border-radius: 999px;
      margin-bottom: 20px;
    }

    .cover-title {
      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1.1;
      margin-bottom: 12px;
      color: #0f172a;
    }

    .cover-subtitle {
      margin: 0 auto 24px;
      max-width: 280px;
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .cover-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .signin-shell {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .demo-btn {
      width: 100%;
      border: 1px solid #d1fae5;
      background: #ecfdf5;
      color: #065f46;
      border-radius: 14px;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    .hidden {
      display: none !important;
    }

    /* Auth Bar Styles */
    .auth-bar {
      padding: 12px 20px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #ffffff;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    .user-info {
      display: flex;
      flex-direction: column;
    }

    .user-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
    }

    .user-email {
      font-size: 11px;
      color: var(--text-muted);
    }

    .signout-btn {
      background: none;
      border: 1px solid #cbd5e1;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }

    .content-area {
      flex: 1;
      padding: 20px 20px 80px 20px;
      overflow-y: auto;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Navigation Bar */
    .nav-bar {
      display: flex;
      border-top: 1px solid #e2e8f0;
      background-color: #ffffff;
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 440px;
      z-index: 10;
    }

    .nav-btn {
      flex: 1;
      padding: 12px 0;
      border: none;
      background: none;
      font-weight: 700;
      font-size: 14px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: color 0.2s;
    }

    .nav-btn.active {
      color: #047857;
      border-top: 3px solid #10b981;
    }

    /* --- TAB 1: TODO --- */
    .todo-header {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      padding: 24px 0;
    }

    .task-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .task-card.dragging {
      opacity: 0.4;
      border-style: dashed;
      background-color: #f0fdf4;
    }

    .left-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .drag-handle {
      color: #cbd5e1;
      font-weight: bold;
      cursor: grab;
      user-select: none;
      padding: 4px;
    }

    .checkbox {
      width: 22px;
      height: 22px;
      min-width: 22px;
      border: 2px solid #cbd5e1;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      font-size: 12px;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .checkbox.checked {
      background-color: var(--primary-green);
      border-color: var(--primary-green);
      color: white;
    }

    .task-title {
      font-weight: 600;
      color: var(--text-main);
      font-size: 15px;
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
    }

    .task-card.completed .task-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .right-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .timer-btn {
      background-color: var(--light-green);
      border: none;
      border-radius: 20px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #047857;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }

    .timer-btn.running {
      background-color: #fef3c7;
      color: #b45309;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #cbd5e1;
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
    }

    .delete-btn:hover { color: #ef4444; }

    .add-btn {
      margin-top: 16px;
      width: 100%;
      padding: 12px;
      background: var(--card-bg);
      border: 1.5px solid #a7f3d0;
      border-radius: 16px;
      color: #047857;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    /* --- TAB 2: REST --- */
    .rest-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-top: 10px;
    }

    .rest-card {
      border-radius: 24px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 190px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .card-yellow { background-color: #fef08a; }
    .card-mint   { background-color: #86efac; }
    .card-cyan   { background-color: #67e8f9; }
    .card-lime   { background-color: #a3e635; }

    .rest-card-top {
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    .rest-icon-bg {
      width: 38px;
      height: 38px;
      background-color: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .rest-info h3 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 4px;
      color: #0f172a;
    }

    .rest-info p {
      font-size: 12px;
      color: #334155;
      line-height: 1.3;
      margin-bottom: 16px;
    }

    .rest-start-btn {
      background: rgba(255, 255, 255, 0.5);
      border: none;
      border-radius: 16px;
      padding: 10px 14px;
      font-weight: 800;
      font-size: 13px;
      color: #0f172a;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
    }

    .rest-start-btn.running {
      background: #0f172a;
      color: #ffffff;
    }

    /* --- TAB 3: TREND --- */
    .trend-section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .trend-section-title h2 {
      font-size: 20px;
      font-weight: 800;
    }

    .status-badge {
      background-color: #e6fffa;
      color: #047857;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 12px;
    }

    .metrics-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .metric-item {
      display: flex;
      flex-direction: column;
    }

    .metric-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .dot-work { background-color: var(--work-blue); }
    .dot-rest { background-color: var(--rest-green); }

    .metric-value {
      font-size: 20px;
      font-weight: 800;
    }

    .progress-bar-container {
      width: 100%;
      height: 12px;
      background-color: #f1f5f9;
      border-radius: 10px;
      display: flex;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-work {
      height: 100%;
      background-color: var(--work-blue);
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-rest {
      height: 100%;
      background-color: var(--rest-green);
      width: 0%;
      transition: width 0.3s ease;
    }

    .percent-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 28px;
    }

    .chart-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 20px 16px 16px 16px;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .chart-header h2 {
      font-size: 18px;
      font-weight: 800;
    }

    .chart-title-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .week-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .week-nav {
      display: flex;
      gap: 4px;
    }

    .week-nav button {
      width: 28px;
      height: 28px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      color: #0f172a;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
    }

    .week-nav button:disabled {
      color: #cbd5e1;
      cursor: not-allowed;
    }

    .legend {
      display: flex;
      gap: 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .legend span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .chart-container {
      display: flex;
      gap: 8px;
      position: relative;
    }

    .y-axis {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 140px;
      padding-bottom: 24px;
      font-size: 10px;
      font-weight: 600;
      color: #94a3b8;
      text-align: right;
    }

    .chart-grid {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 140px;
      position: relative;
    }

    .grid-line {
      width: 100%;
      height: 1px;
      border-bottom: 1.5px dashed #e2e8f0;
    }

    .bar-chart-bars {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 24px;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
    }

    .bar-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      cursor: pointer;
      height: 100%;
      justify-content: flex-end;
      flex: 1;
    }

    .bar-stack {
      width: 12px;
      display: flex;
      flex-direction: column-reverse;
      border-radius: 6px;
      overflow: hidden;
    }

    .bar-segment-work {
      background-color: var(--work-blue);
      width: 100%;
    }

    .bar-segment-rest {
      background-color: var(--rest-green);
      width: 100%;
    }

    .day-label {
      position: absolute;
      bottom: -22px;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
    }

    .bar-column.today .day-label {
      color: #047857;
      font-weight: 800;
    }

    .today-pill {
      position: absolute;
      bottom: -25px;
      width: 32px;
      height: 20px;
      background-color: #d1fae5;
      border-radius: 10px;
      z-index: -1;
    }
  </style>
</head>
<body>
  <div id="signInCover" class="cover-screen">
    <div class="cover-card">
      <div class="cover-brand">Time &amp; Balance</div>
      <h1 class="cover-title">Stay focused.</h1>
      <p class="cover-subtitle">Sign in to track your work, rest, and daily balance.</p>

      <div class="cover-actions">
        <div id="googleSignInCover" class="signin-shell">
          <div id="g_id_onload"
            data-client_id="858943936110-shufieh5t5vck57us06jbnac830502e5.apps.googleusercontent.com"
            data-callback="handleCredentialResponse"
            data-auto_prompt="false">
          </div>
          <div class="g_id_signin" data-type="standard" data-size="medium" data-theme="outline"></div>
        </div>

        <button class="demo-btn" onclick="demoSignIn()">Continue as Guest</button>
      </div>
    </div>
  </div>

  <div id="appContainer" class="app-container hidden">
    <div class="auth-bar">
      <div id="googleSignInContainer" style="display: none;">
        <div class="g_id_signin" data-type="standard" data-size="medium" data-theme="outline"></div>
      </div>

      <div id="userProfile" class="user-profile" style="display: none;">
        <img id="userAvatar" class="user-avatar" src="" alt="Profile">
        <div class="user-info">
          <span id="userName" class="user-name">User</span>
          <span id="userEmail" class="user-email">email@example.com</span>
        </div>
        <button class="signout-btn" onclick="signOut()">Sign Out</button>
      </div>
    </div>

    <div class="content-area">

      <div id="todoTab" class="tab-content active">
        <h1 class="todo-header" id="todoHeader">Trevan, wassup?</h1>
        <div id="taskList" class="task-list"></div>
        <button class="add-btn" onclick="addNewTask()">+ Add Task</button>
      </div>

      <div id="restTab" class="tab-content">
        <h1 class="todo-header">Rest Time</h1>
        <div class="rest-grid" id="restGrid"></div>
      </div>

      <div id="trendTab" class="tab-content">
        <div class="trend-section-title">
          <h2>Today's Balance</h2>
        </div>

        <div class="metrics-row">
          <div class="metric-item">
            <span class="metric-label"><span class="dot dot-work"></span> Work Time</span>
            <span class="metric-value" id="totalWorkDisplay">0m 0s</span>
          </div>
          <div class="metric-item">
            <span class="metric-label"><span class="dot dot-rest"></span> Rest Time</span>
            <span class="metric-value" id="totalRestDisplay">0m 0s</span>
          </div>
        </div>

        <div class="progress-bar-container">
          <div class="progress-work" id="workProgressBar"></div>
          <div class="progress-rest" id="restProgressBar"></div>
        </div>

        <div class="percent-row">
          <span id="workPercentLabel">0% Work</span>
          <span id="restPercentLabel">0% Rest</span>
        </div>

        <div class="chart-card">
          <div class="chart-header">
            <div class="chart-title-group">
              <h2>Weekly Activity</h2>
              <span class="week-label" id="weekLabel">Week of Monday</span>
            </div>
            <div class="legend">
              <span><span class="dot dot-work"></span> Work</span>
              <span><span class="dot dot-rest"></span> Rest</span>
            </div>
            <div class="week-nav">
              <button type="button" aria-label="Previous week" onclick="changeTrendWeek(-1)">‹</button>
              <button type="button" id="nextWeekButton" aria-label="Next week" onclick="changeTrendWeek(1)">›</button>
            </div>
          </div>

          <div class="chart-container">
            <div class="y-axis">
              <span>4h</span>
              <span>2h</span>
              <span>0h</span>
            </div>

            <div class="chart-grid">
              <div class="grid-line"></div>
              <div class="grid-line"></div>
              <div class="grid-line"></div>

              <div class="bar-chart-bars" id="weeklyActivityBars"></div>
            </div>
          </div>
        </div>

      </div>

    </div>

    <nav class="nav-bar">
      <button class="nav-btn active" onclick="switchTab('todoTab', this)">
        <span>☑</span> Todo
      </button>
      <button class="nav-btn" onclick="switchTab('restTab', this)">
        <span>☕</span> Rest
      </button>
      <button class="nav-btn" onclick="switchTab('trendTab', this)">
        <span>📊</span> Trend
      </button>
    </nav>
  </div>

  <script>
    // GOOGLE AUTHENTICATION LOGIC
    const googleClientId = document.getElementById('g_id_onload').dataset.client_id;
    let googleAccessToken = null;
    let driveDataFileId = null;
    let driveTokenClient = null;
    let saveTimer = null;
    let activeUser = null;

    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    function handleCredentialResponse(response) {
      const payload = parseJwt(response.credential);

      // Save session
      localStorage.setItem('google_user', JSON.stringify(payload));
      activeUser = payload;
      loadLocalState(payload);

      updateAuthUI(payload);
      renderTasks();
      renderRestCards();
      startDriveSync();
    }

    function demoSignIn() {
      const demoUser = {
        given_name: 'Trevan',
        name: 'Trevan',
        email: 'trevan@example.com',
        picture: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=200&q=80',
        isDemo: true
      };

      localStorage.setItem('google_user', JSON.stringify(demoUser));
      activeUser = demoUser;
      loadLocalState(demoUser);
      updateAuthUI(demoUser);
      renderTasks();
      renderRestCards();
    }

    function updateAuthUI(user) {
      const appContainer = document.getElementById('appContainer');
      const coverScreen = document.getElementById('signInCover');
      const googleSignInContainer = document.getElementById('googleSignInContainer');
      const userProfile = document.getElementById('userProfile');

      if (user) {
        appContainer.classList.remove('hidden');
        coverScreen.classList.add('hidden');

        if (googleSignInContainer) googleSignInContainer.style.display = 'none';
        if (userProfile) userProfile.style.display = 'flex';

        document.getElementById('userName').innerText = user.given_name || user.name;
        document.getElementById('userEmail').innerText = user.email;
        document.getElementById('userAvatar').src = user.picture;

        const header = document.getElementById('todoHeader');
        if (header) {
          header.innerText = `${user.given_name || user.name}, wassup?`;
        }
      } else {
        appContainer.classList.add('hidden');
        coverScreen.classList.remove('hidden');

        if (googleSignInContainer) googleSignInContainer.style.display = 'none';
        if (userProfile) userProfile.style.display = 'none';

        const header = document.getElementById('todoHeader');
        if (header) {
          header.innerText = 'Trevan, wassup?';
        }
      }
    }

    function signOut() {
      if (googleAccessToken && window.google) {
        google.accounts.oauth2.revoke(googleAccessToken);
      }
      googleAccessToken = null;
      driveDataFileId = null;
      activeUser = null;
      localStorage.removeItem('google_user');
      if (window.google) {
        google.accounts.id.disableAutoSelect();
      }
      updateAuthUI(null);
    }

    // STATE MANAGEMENT
    let tasks = [];

    let restCards = [
      { id: 1, title: 'TV', desc: 'Unwind with favorite videos', icon: '📺', colorClass: 'card-yellow', remaining: 1800, usedSeconds: 0, running: false },
      { id: 2, title: 'Chill', desc: 'Breathe, tea, mindfulness', icon: '🧘', colorClass: 'card-mint', remaining: 1800, usedSeconds: 0, running: false },
      { id: 3, title: 'Chat', desc: 'Catch up with friends', icon: '💬', colorClass: 'card-cyan', remaining: 1800, usedSeconds: 0, running: false },
      { id: 4, title: 'Other fun stuff', desc: 'Light games or a brisk walk', icon: '🎉', colorClass: 'card-lime', remaining: 1800, usedSeconds: 0, running: false }
    ];

    let workInterval = null;
    let restInterval = null;
    let draggedIndex = null;
    let activityByDate = {};
    let trendWeekOffset = 0;

    function getStateStorageKey(user) {
      return `timely_state_${encodeURIComponent(user.email || 'guest')}`;
    }

    function getAppState() {
      return {
        tasks: tasks.map(task => ({ ...task, running: false })),
        restCards: restCards.map(card => ({ ...card, running: false })),
        activityByDate,
        updatedAt: new Date().toISOString()
      };
    }

    function applyAppState(state) {
      if (Array.isArray(state?.tasks)) {
        tasks = state.tasks.map(task => ({ ...task, running: false }));
      }
      if (Array.isArray(state?.restCards)) {
        restCards = state.restCards.map(card => ({ ...card, running: false }));
      }
      if (state?.activityByDate && typeof state.activityByDate === 'object') {
        activityByDate = state.activityByDate;
      } else {
        const todayKey = getDateKey(new Date());
        activityByDate = {
          [todayKey]: {
            work: tasks.reduce((total, task) => total + task.time, 0),
            rest: restCards.reduce((total, card) => total + card.usedSeconds, 0)
          }
        };
      }
    }

    function loadLocalState(user) {
      const savedState = localStorage.getItem(getStateStorageKey(user));
      if (!savedState) return;

      try {
        applyAppState(JSON.parse(savedState));
      } catch (error) {
        console.warn('Unable to load local app data.', error);
      }
    }

    function persistLocalState() {
      if (!activeUser) return;
      localStorage.setItem(getStateStorageKey(activeUser), JSON.stringify(getAppState()));
    }

    function scheduleDataSave() {
      persistLocalState();
      if (!googleAccessToken || saveTimer) return;

      saveTimer = setTimeout(async () => {
        saveTimer = null;
        try {
          await saveDataToDrive();
        } catch (error) {
          console.warn('Google Drive save failed.', error);
        }
      }, 5000);
    }

    function getDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getMonday(date) {
      const monday = new Date(date);
      const day = monday.getDay();
      const daysSinceMonday = day === 0 ? 6 : day - 1;
      monday.setDate(monday.getDate() - daysSinceMonday);
      monday.setHours(0, 0, 0, 0);
      return monday;
    }

    function recordActivity(type, seconds) {
      const dateKey = getDateKey(new Date());
      if (!activityByDate[dateKey]) {
        activityByDate[dateKey] = { work: 0, rest: 0 };
      }
      activityByDate[dateKey][type] += seconds;
    }

    async function loadDataFromDrive() {
      const query = encodeURIComponent("name = 'timely-data.json' and 'appDataFolder' in parents and trashed = false");
      const listResponse = await fetch(`https://www.googleapis.com/drive/v3/files?q=${query}&spaces=appDataFolder&fields=files(id)`, {
        headers: { Authorization: `Bearer ${googleAccessToken}` }
      });
      if (!listResponse.ok) throw new Error('Unable to find Timely data in Google Drive.');

      const files = (await listResponse.json()).files || [];
      if (!files.length) {
        await saveDataToDrive();
        return;
      }

      driveDataFileId = files[0].id;
      const dataResponse = await fetch(`https://www.googleapis.com/drive/v3/files/${driveDataFileId}?alt=media`, {
        headers: { Authorization: `Bearer ${googleAccessToken}` }
      });
      if (!dataResponse.ok) throw new Error('Unable to load Timely data from Google Drive.');

      applyAppState(await dataResponse.json());
      renderTasks();
      renderRestCards();
    }

    async function saveDataToDrive() {
      if (!googleAccessToken) return;

      const state = JSON.stringify(getAppState());
      const headers = {
        Authorization: `Bearer ${googleAccessToken}`,
        'Content-Type': 'application/json'
      };

      if (driveDataFileId) {
        const response = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveDataFileId}?uploadType=media`, {
          method: 'PATCH',
          headers,
          body: state
        });
        if (!response.ok) throw new Error('Unable to save Timely data to Google Drive.');
        return;
      }

      const boundary = 'timely_data_boundary';
      const metadata = JSON.stringify({ name: 'timely-data.json', parents: ['appDataFolder'], mimeType: 'application/json' });
      const body = [
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${metadata}\r\n`,
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${state}\r\n`,
        `--${boundary}--`
      ].join('');

      const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST',
        headers: {
          Authorization: `Bearer ${googleAccessToken}`,
          'Content-Type': `multipart/related; boundary=${boundary}`
        },
        body
      });
      if (!response.ok) throw new Error('Unable to create Timely data in Google Drive.');
      driveDataFileId = (await response.json()).id;
    }

    function startDriveSync() {
      if (!window.google?.accounts?.oauth2) {
        setTimeout(startDriveSync, 500);
        return;
      }

      driveTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: googleClientId,
        scope: 'https://www.googleapis.com/auth/drive.appdata',
        callback: async (tokenResponse) => {
          if (tokenResponse.error) {
            console.warn('Google Drive sync was not authorized.', tokenResponse);
            return;
          }
          googleAccessToken = tokenResponse.access_token;
          try {
            await loadDataFromDrive();
          } catch (error) {
            console.warn('Google Drive sync failed.', error);
          }
        }
      });
      driveTokenClient.requestAccessToken({ prompt: '' });
    }

    function switchTab(tabId, btnElement) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      btnElement.classList.add('active');

      if (tabId === 'restTab') {
        renderRestCards();
      } else if (tabId === 'trendTab') {
        updateTrendMetrics();
      }
    }

    function formatTime(seconds) {
      const h = String(Math.floor(seconds / 3600)).padStart(2, '0');
      const m = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
      const s = String(seconds % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function formatCountdown(seconds) {
      const m = String(Math.floor(seconds / 60)).padStart(2, '0');
      const s = String(seconds % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function formatMinSec(totalSecs) {
      const mins = Math.floor(totalSecs / 60);
      const secs = totalSecs % 60;
      return `${mins}m ${secs}s`;
    }

    /* --- TODO TAB LOGIC --- */
    function renderTasks() {
      const listContainer = document.getElementById('taskList');
      if (!listContainer) return;
      listContainer.innerHTML = '';

      if (tasks.length === 0) {
        listContainer.innerHTML = '<div class="empty-state">No tasks yet. Click "+ Add Task" to begin!</div>';
        return;
      }

      tasks.forEach((task, index) => {
        const card = document.createElement('div');
        card.className = `task-card ${task.completed ? 'completed' : ''}`;
        card.draggable = true;
        card.dataset.index = index;

        card.addEventListener('dragstart', (e) => {
          draggedIndex = index;
          card.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });

        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          draggedIndex = null;
        });

        card.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
        });

        card.addEventListener('drop', (e) => {
          e.preventDefault();
          if (draggedIndex !== null && draggedIndex !== index) {
            const itemToMove = tasks.splice(draggedIndex, 1)[0];
            tasks.splice(index, 0, itemToMove);
            renderTasks();
            scheduleDataSave();
          }
        });

        card.innerHTML = `
          <div class="left-group">
            <span class="drag-handle">=</span>
            <div class="checkbox ${task.completed ? 'checked' : ''}" data-id="${task.id}">
              ${task.completed ? '✓' : ''}
            </div>
            <input class="task-title" value="${task.title}" onchange="updateTitle(${task.id}, this.value)">
          </div>
          <div class="right-group">
            <button class="timer-btn ${task.running ? 'running' : ''}" onclick="toggleTimer(${task.id})">
              <span>${task.running ? '❚❚' : '▶'}</span>
              <span>${formatTime(task.time)}</span>
            </button>
            <button class="delete-btn" onclick="deleteTask(${task.id})">🗑</button>
          </div>
        `;

        const checkboxEl = card.querySelector('.checkbox');
        checkboxEl.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleTask(task.id);
        });

        listContainer.appendChild(card);
      });
    }

    function toggleTask(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      renderTasks();
      scheduleDataSave();
    }

    function updateTitle(id, newTitle) {
      tasks = tasks.map(t => t.id === id ? { ...t, title: newTitle } : t);
      scheduleDataSave();
    }

    function toggleTimer(id) {
      stopAllRestTimers();
      tasks = tasks.map(t => t.id === id ? { ...t, running: !t.running } : { ...t, running: false });

      const anyRunning = tasks.some(t => t.running);
      if (anyRunning && !workInterval) {
        workInterval = setInterval(() => {
          tasks = tasks.map(t => t.running ? { ...t, time: t.time + 1 } : t);
          recordActivity('work', 1);
          renderTasks();
          renderWeeklyActivity();
          scheduleDataSave();
        }, 1000);
      } else if (!anyRunning) {
        clearInterval(workInterval);
        workInterval = null;
      }
      renderTasks();
      scheduleDataSave();
    }

    function addNewTask() {
      tasks.push({ id: Date.now(), title: 'New Task', time: 0, completed: false, running: false });
      renderTasks();
      scheduleDataSave();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      renderTasks();
      scheduleDataSave();
    }

    /* --- REST TAB LOGIC --- */
    function renderRestCards() {
      const restGrid = document.getElementById('restGrid');
      if (!restGrid) return;
      restGrid.innerHTML = '';

      restCards.forEach((card) => {
        const el = document.createElement('div');
        el.className = `rest-card ${card.colorClass}`;
        const isFinished = card.remaining <= 0;

        el.innerHTML = `
          <div class="rest-card-top">
            <div class="rest-icon-bg">${card.icon}</div>
          </div>
          <div class="rest-info">
            <h3>${card.title}</h3>
            <p>${card.desc}</p>
            <button class="rest-start-btn ${card.running ? 'running' : ''}" onclick="toggleRestTimer(${card.id})" ${isFinished ? 'disabled' : ''}>
              <span>${card.running ? '❚❚ Pause ' + formatCountdown(card.remaining) : (isFinished ? 'Finished' : '▶ Start ' + formatCountdown(card.remaining))}</span>
            </button>
          </div>
        `;
        restGrid.appendChild(el);
      });
    }

    function stopAllWorkTimers() {
      tasks = tasks.map(t => ({ ...t, running: false }));
      clearInterval(workInterval);
      workInterval = null;
      renderTasks();
      scheduleDataSave();
    }

    function stopAllRestTimers() {
      restCards = restCards.map(c => ({ ...c, running: false }));
      clearInterval(restInterval);
      restInterval = null;
      renderRestCards();
      scheduleDataSave();
    }

    function toggleRestTimer(id) {
      stopAllWorkTimers();

      restCards = restCards.map(c => c.id === id ? { ...c, running: !c.running } : { ...c, running: false });

      const anyRunning = restCards.some(c => c.running);
      if (anyRunning && !restInterval) {
        restInterval = setInterval(() => {
          restCards = restCards.map(c => {
            if (c.running && c.remaining > 0) {
              return { ...c, remaining: c.remaining - 1, usedSeconds: c.usedSeconds + 1 };
            } else if (c.running && c.remaining <= 0) {
              return { ...c, running: false };
            }
            return c;
          });

          if (restCards.some(card => card.running)) {
            recordActivity('rest', 1);
          }

          if (!restCards.some(c => c.running)) {
            clearInterval(restInterval);
            restInterval = null;
          }
          renderRestCards();
          renderWeeklyActivity();
          scheduleDataSave();
        }, 1000);
      } else if (!anyRunning) {
        clearInterval(restInterval);
        restInterval = null;
      }

      renderRestCards();
      scheduleDataSave();
    }

    /* --- TREND TAB LOGIC --- */
    function changeTrendWeek(direction) {
      trendWeekOffset += direction;
      if (trendWeekOffset > 0) trendWeekOffset = 0;
      renderWeeklyActivity();
    }

    function renderWeeklyActivity() {
      const barsContainer = document.getElementById('weeklyActivityBars');
      const weekLabel = document.getElementById('weekLabel');
      const nextWeekButton = document.getElementById('nextWeekButton');
      if (!barsContainer || !weekLabel || !nextWeekButton) return;

      const currentMonday = getMonday(new Date());
      const selectedMonday = new Date(currentMonday);
      selectedMonday.setDate(selectedMonday.getDate() + trendWeekOffset * 7);
      weekLabel.innerText = `Week of ${selectedMonday.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}`;
      nextWeekButton.disabled = trendWeekOffset === 0;

      const days = Array.from({ length: 7 }, (_, index) => {
        const date = new Date(selectedMonday);
        date.setDate(selectedMonday.getDate() + index);
        const dateKey = getDateKey(date);
        return {
          date,
          dateKey,
          activity: activityByDate[dateKey] || { work: 0, rest: 0 }
        };
      });
      const maxSeconds = Math.max(4 * 60 * 60, ...days.map(day => day.activity.work + day.activity.rest));
      const todayKey = getDateKey(new Date());

      barsContainer.innerHTML = days.map(day => {
        const workHeight = Math.round((day.activity.work / maxSeconds) * 116);
        const restHeight = Math.round((day.activity.rest / maxSeconds) * 116);
        const isToday = day.dateKey === todayKey;
        return `
          <div class="bar-column${isToday ? ' today' : ''}" title="${day.activity.work}s work, ${day.activity.rest}s rest">
            ${isToday ? '<div class="today-pill"></div>' : ''}
            <div class="bar-stack">
              <div class="bar-segment-work" style="height: ${workHeight}px;"></div>
              <div class="bar-segment-rest" style="height: ${restHeight}px;"></div>
            </div>
            <span class="day-label">${isToday ? 'Today' : day.date.toLocaleDateString(undefined, { weekday: 'short' })}</span>
          </div>
        `;
      }).join('');
    }

    function updateTrendMetrics() {
      const totalWorkSeconds = tasks.reduce((acc, curr) => acc + curr.time, 0);
      const totalRestSeconds = restCards.reduce((acc, curr) => acc + curr.usedSeconds, 0);

      document.getElementById('totalWorkDisplay').innerText = formatMinSec(totalWorkSeconds);
      document.getElementById('totalRestDisplay').innerText = formatMinSec(totalRestSeconds);

      const totalSeconds = totalWorkSeconds + totalRestSeconds;
      let workPct = 0;
      let restPct = 0;

      if (totalSeconds > 0) {
        workPct = Math.round((totalWorkSeconds / totalSeconds) * 100);
        restPct = 100 - workPct;
      }

      document.getElementById('workProgressBar').style.width = `${workPct}%`;
      document.getElementById('restProgressBar').style.width = `${restPct}%`;

      document.getElementById('workPercentLabel').innerText = `${workPct}% Work`;
      document.getElementById('restPercentLabel').innerText = `${restPct}% Rest`;
      renderWeeklyActivity();
    }

    // Initialize App
    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('google_user');
      const user = savedUser ? JSON.parse(savedUser) : null;
      if (user) {
        activeUser = user;
        loadLocalState(user);
      }
      updateAuthUI(user);

      renderTasks();
      renderRestCards();

      if (user && !user.isDemo) {
        startDriveSync();
      }
    });
  </script>
</body>
